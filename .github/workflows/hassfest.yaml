name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron:  '0 0 * * *'

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@v4"
        - name: Run regression tests
          run: python -m unittest discover -s tests -v
        - uses: "home-assistant/actions/hassfest@master"
