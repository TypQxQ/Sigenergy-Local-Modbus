name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron:  '0 0 * * *'

jobs:
  regression:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        modbus_connection: ["4.12.3", "4.12.4"]
    env:
      SIGEN_REQUIRE_MODBUS_CONNECTION: "1"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
      - name: Install Modbus test dependency
        run: python -m pip install "modbus-connection==${{ matrix.modbus_connection }}"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  validate:
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@v4"
        - uses: "home-assistant/actions/hassfest@master"
