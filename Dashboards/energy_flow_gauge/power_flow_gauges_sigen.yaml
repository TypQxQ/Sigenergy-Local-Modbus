# Home Assistant Power Flow Gauges for Sigenergy Inverter
# https://github.com/TypQxQ/Sigenergy-Local-Modbus
# by Andrei Ignat (TypQxQ)
# last update: 2026-11-03
#

# These are Home Assistant entities used by the power flow gauges card.
# It is done in HA instead of the card itself with config-template-card to avoid flickering.

# To change the sensors to your own sensors, change the sensor names starting with "sensor.sigen_".
# To change duration of the statistics, change the "hours: 24" to the desired duration.

# The package uses the statistics integration to calculate the max and mean values for the power flow gauges.
# All power flow calculations are now done with template sensors only.

################################################
# Sensors to calculate the power flow for the ESS.
################################################

template:
  - sensor:
      ################################################
      # Sensors to remap to your own sensors if not using the Sigen sensors.
      # Missing source readings make dependent sensors unavailable; valid zeroes are retained.
      ################################################
      - name: Power Flow Gauge - Total Consumption
        availability: >-
          {{ is_number(states('sensor.sigen_plant_consumed_power')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_total_consumption
        state: >-
          {% if is_number(states('sensor.sigen_plant_consumed_power')) %}
          {{ states('sensor.sigen_plant_consumed_power') | float(0) }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Power Flow Gauge - Total Solar
        availability: >-
          {{ is_number(states('sensor.sigen_plant_pv_power')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_total_solar
        state: >-
          {% if is_number(states('sensor.sigen_plant_pv_power')) %}
          {{ states('sensor.sigen_plant_pv_power') | float(0) }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Power Flow Gauge - Total Grid Import
        availability: >-
          {{ is_number(states('sensor.sigen_plant_grid_import_power')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_total_grid_import
        state: >-
          {% if is_number(states('sensor.sigen_plant_grid_import_power')) %}
          {{ states('sensor.sigen_plant_grid_import_power') | float(0) }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Power Flow Gauge - Total Grid Export
        availability: >-
          {{ is_number(states('sensor.sigen_plant_grid_export_power')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_total_grid_export
        state: >-
          {% if is_number(states('sensor.sigen_plant_grid_export_power')) %}
          {{ states('sensor.sigen_plant_grid_export_power') | float(0) }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Power Flow Gauge - Total Battery Discharging
        availability: >-
          {{ is_number(states('sensor.sigen_plant_battery_power')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_total_battery_discharging
        state: >-
          {% if is_number(states('sensor.sigen_plant_battery_power')) %}
          {{ [0, -(states('sensor.sigen_plant_battery_power') | float(0))] | max }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Power Flow Gauge - Total Battery Charging
        availability: >-
          {{ is_number(states('sensor.sigen_plant_battery_power')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_total_battery_charging
        state: >-
          {% if is_number(states('sensor.sigen_plant_battery_power')) %}
          {{ [0, states('sensor.sigen_plant_battery_power') | float(0)] | max }}
          {% else %}
            {{ none }}
          {% endif %}

      ################################################
      # Power flow gauge calculations
      ################################################
      - name: Power Flow Gauge - Solar to House
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_total_consumption')) and is_number(states('sensor.power_flow_gauge_total_solar')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_solar_to_house
        state: >-
          {% if is_number(states('sensor.power_flow_gauge_total_consumption')) and is_number(states('sensor.power_flow_gauge_total_solar')) %}
          {{ [states('sensor.power_flow_gauge_total_solar') | float(0), states('sensor.power_flow_gauge_total_consumption') | float(0)] | min }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Power Flow Gauge - Solar to Battery
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_solar_to_house')) and is_number(states('sensor.power_flow_gauge_total_battery_charging')) and is_number(states('sensor.power_flow_gauge_total_solar')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_solar_to_battery
        state: >-
          {% if is_number(states('sensor.power_flow_gauge_solar_to_house')) and is_number(states('sensor.power_flow_gauge_total_battery_charging')) and is_number(states('sensor.power_flow_gauge_total_solar')) %}
          {% set solar = states('sensor.power_flow_gauge_total_solar') | float(0) %}
          {% set solar_to_house = states('sensor.power_flow_gauge_solar_to_house') | float(0) %}
          {% set battery_charging = states('sensor.power_flow_gauge_total_battery_charging') | float(0) %}
          {{ [0, [battery_charging, [0, solar - solar_to_house] | max] | min] | max }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Power Flow Gauge - Solar to Grid
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_solar_to_battery')) and is_number(states('sensor.power_flow_gauge_solar_to_house')) and is_number(states('sensor.power_flow_gauge_total_grid_export')) and is_number(states('sensor.power_flow_gauge_total_solar')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_solar_to_grid
        state: >-
          {% if is_number(states('sensor.power_flow_gauge_solar_to_battery')) and is_number(states('sensor.power_flow_gauge_solar_to_house')) and is_number(states('sensor.power_flow_gauge_total_grid_export')) and is_number(states('sensor.power_flow_gauge_total_solar')) %}
          {% set solar = states('sensor.power_flow_gauge_total_solar') | float(0) %}
          {% set solar_to_battery = states('sensor.power_flow_gauge_solar_to_battery') | float(0) %}
          {% set solar_to_house = states('sensor.power_flow_gauge_solar_to_house') | float(0) %}
          {% set grid_export = states('sensor.power_flow_gauge_total_grid_export') | float(0) %}
          {{ [grid_export, [0, solar - solar_to_battery - solar_to_house] | max] | min }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Power Flow Gauge - Battery to House
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_solar_to_house')) and is_number(states('sensor.power_flow_gauge_total_battery_discharging')) and is_number(states('sensor.power_flow_gauge_total_consumption')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_battery_to_house
        state: >-
          {% if is_number(states('sensor.power_flow_gauge_solar_to_house')) and is_number(states('sensor.power_flow_gauge_total_battery_discharging')) and is_number(states('sensor.power_flow_gauge_total_consumption')) %}
          {% set battery_discharging = states('sensor.power_flow_gauge_total_battery_discharging') | float(0) %}
          {% set consumption = states('sensor.power_flow_gauge_total_consumption') | float(0) %}
          {% set consumption_from_solar = states('sensor.power_flow_gauge_solar_to_house') | float(0) %}
          {{ [battery_discharging, [0, consumption - consumption_from_solar] | max] | min }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Power Flow Gauge - Battery to Grid
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_battery_to_house')) and is_number(states('sensor.power_flow_gauge_total_battery_discharging')) and is_number(states('sensor.power_flow_gauge_total_grid_export')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_battery_to_grid
        state: >-
          {% if is_number(states('sensor.power_flow_gauge_battery_to_house')) and is_number(states('sensor.power_flow_gauge_total_battery_discharging')) and is_number(states('sensor.power_flow_gauge_total_grid_export')) %}
          {% set grid_export = states('sensor.power_flow_gauge_total_grid_export') | float(0) %}
          {% set battery_discharging = states('sensor.power_flow_gauge_total_battery_discharging') | float(0) %}
          {% set battery_to_house = states('sensor.power_flow_gauge_battery_to_house') | float(0) %}
          {{ [grid_export, [0, battery_discharging - battery_to_house] | max] | min }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Power Flow Gauge - Grid to House
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_battery_to_house')) and is_number(states('sensor.power_flow_gauge_solar_to_house')) and is_number(states('sensor.power_flow_gauge_total_consumption')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_grid_to_house
        state: >-
          {% if is_number(states('sensor.power_flow_gauge_battery_to_house')) and is_number(states('sensor.power_flow_gauge_solar_to_house')) and is_number(states('sensor.power_flow_gauge_total_consumption')) %}
          {% set consumption = states('sensor.power_flow_gauge_total_consumption') | float(0) %}
          {% set solar_to_house = states('sensor.power_flow_gauge_solar_to_house') | float(0) %}
          {% set battery_to_house = states('sensor.power_flow_gauge_battery_to_house') | float(0) %}
          {{ [0, consumption - solar_to_house - battery_to_house] | max }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Power Flow Gauge - Grid to Battery
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_grid_to_house')) and is_number(states('sensor.power_flow_gauge_total_battery_charging')) and is_number(states('sensor.power_flow_gauge_total_grid_import')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_grid_to_battery
        state: >-
          {% if is_number(states('sensor.power_flow_gauge_grid_to_house')) and is_number(states('sensor.power_flow_gauge_total_battery_charging')) and is_number(states('sensor.power_flow_gauge_total_grid_import')) %}
          {% set battery_charging = states('sensor.power_flow_gauge_total_battery_charging') | float(0) %}
          {% set grid_import = states('sensor.power_flow_gauge_total_grid_import') | float(0) %}
          {% set grid_to_house = states('sensor.power_flow_gauge_grid_to_house') | float(0) %}
          {{ [battery_charging, [0, grid_import - grid_to_house] | max] | min }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Power Flow Gauge - Consumption from Solar
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_solar_to_house')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_consumption_from_solar
        state: >-
          {% if is_number(states('sensor.power_flow_gauge_solar_to_house')) %}
          {{ states('sensor.power_flow_gauge_solar_to_house') | float(0) }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Power Flow Gauge - Consumption from Battery
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_battery_to_house')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_consumption_from_battery
        state: >-
          {% if is_number(states('sensor.power_flow_gauge_battery_to_house')) %}
          {{ states('sensor.power_flow_gauge_battery_to_house') | float(0) }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: Power Flow Gauge - Consumption from Grid
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_grid_to_house')) }}
        unit_of_measurement: "kW"
        unique_id: power_flow_gauge_consumption_from_grid
        state: >-
          {% if is_number(states('sensor.power_flow_gauge_grid_to_house')) %}
          {{ states('sensor.power_flow_gauge_grid_to_house') | float(0) }}
          {% else %}
            {{ none }}
          {% endif %}

      ################################################
      # Sensors to calculate difference between current value and max.
      ################################################
      - name: "Power Flow Gauge Consumption Until Max"
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_consumption_from_battery')) and is_number(states('sensor.power_flow_gauge_consumption_from_grid')) and is_number(states('sensor.power_flow_gauge_consumption_from_solar')) and is_number(states('sensor.power_flow_gauge_max_consumption')) and is_number(states('sensor.power_flow_gauge_mean_consumption')) }}
        unit_of_measurement: "kW"
        state: >
          {% if is_number(states('sensor.power_flow_gauge_consumption_from_battery')) and is_number(states('sensor.power_flow_gauge_consumption_from_grid')) and is_number(states('sensor.power_flow_gauge_consumption_from_solar')) and is_number(states('sensor.power_flow_gauge_max_consumption')) and is_number(states('sensor.power_flow_gauge_mean_consumption')) %}
          {{ states('sensor.power_flow_gauge_max_consumption')|float(0)
            - max(
                states('sensor.power_flow_gauge_mean_consumption')|float(0),
                states('sensor.power_flow_gauge_consumption_from_solar')|float(0)
                + states('sensor.power_flow_gauge_consumption_from_battery')|float(0)
                + states('sensor.power_flow_gauge_consumption_from_grid')|float(0)
              )
          }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: "Power Flow Gauge Grid Import Until Mean"
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_grid_to_battery')) and is_number(states('sensor.power_flow_gauge_grid_to_house')) and is_number(states('sensor.power_flow_gauge_mean_grid_import')) }}
        unit_of_measurement: "kW"
        state: >
          {% if is_number(states('sensor.power_flow_gauge_grid_to_battery')) and is_number(states('sensor.power_flow_gauge_grid_to_house')) and is_number(states('sensor.power_flow_gauge_mean_grid_import')) %}
          {% set mean = states('sensor.power_flow_gauge_mean_grid_import')|float(0) %}
          {% set to_house = states('sensor.power_flow_gauge_grid_to_house')|float(0) %}
          {% set to_battery = states('sensor.power_flow_gauge_grid_to_battery')|float(0) %}
          {{ [0, mean - to_house - to_battery] | max }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: "Power Flow Gauge Grid Import Until Max"
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_grid_to_battery')) and is_number(states('sensor.power_flow_gauge_grid_to_house')) and is_number(states('sensor.power_flow_gauge_max_grid_import')) and is_number(states('sensor.power_flow_gauge_mean_grid_import')) }}
        unit_of_measurement: "kW"
        state: >
          {% if is_number(states('sensor.power_flow_gauge_grid_to_battery')) and is_number(states('sensor.power_flow_gauge_grid_to_house')) and is_number(states('sensor.power_flow_gauge_max_grid_import')) and is_number(states('sensor.power_flow_gauge_mean_grid_import')) %}
          {% set max_import = states('sensor.power_flow_gauge_max_grid_import')|float(0) %}
          {% set mean_import = states('sensor.power_flow_gauge_mean_grid_import')|float(0) %}
          {% set to_house = states('sensor.power_flow_gauge_grid_to_house')|float(0) %}
          {% set to_battery = states('sensor.power_flow_gauge_grid_to_battery')|float(0) %}
          {% set used_now = to_house + to_battery %}
          {% set baseline = [mean_import, used_now] | max %}
          {{ max_import - baseline }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: "Power Flow Gauge Grid Export Until Max"
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_battery_to_grid')) and is_number(states('sensor.power_flow_gauge_max_grid_export')) and is_number(states('sensor.power_flow_gauge_mean_grid_export')) and is_number(states('sensor.power_flow_gauge_solar_to_grid')) }}
        unit_of_measurement: "kW"
        state: >
          {% if is_number(states('sensor.power_flow_gauge_battery_to_grid')) and is_number(states('sensor.power_flow_gauge_max_grid_export')) and is_number(states('sensor.power_flow_gauge_mean_grid_export')) and is_number(states('sensor.power_flow_gauge_solar_to_grid')) %}
          {% set max_export = states('sensor.power_flow_gauge_max_grid_export')|float(0) %}
          {% set mean_export = states('sensor.power_flow_gauge_mean_grid_export')|float(0) %}
          {% set solar_to_grid = states('sensor.power_flow_gauge_solar_to_grid')|float(0) %}
          {% set battery_to_grid = states('sensor.power_flow_gauge_battery_to_grid')|float(0) %}
          {% set exported_now = solar_to_grid + battery_to_grid %}
          {% set baseline = [mean_export, exported_now] | max %}
          {{ max_export - baseline }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: "Power Flow Gauge Max Solar Remaining"
        availability: >-
          {{ is_number(states('sensor.power_flow_gauge_max_solar')) and is_number(states('sensor.power_flow_gauge_mean_solar')) and is_number(states('sensor.power_flow_gauge_solar_to_battery')) and is_number(states('sensor.power_flow_gauge_solar_to_grid')) and is_number(states('sensor.power_flow_gauge_solar_to_house')) }}
        unit_of_measurement: "kW"
        state: >
          {% if is_number(states('sensor.power_flow_gauge_max_solar')) and is_number(states('sensor.power_flow_gauge_mean_solar')) and is_number(states('sensor.power_flow_gauge_solar_to_battery')) and is_number(states('sensor.power_flow_gauge_solar_to_grid')) and is_number(states('sensor.power_flow_gauge_solar_to_house')) %}
          {% set max_solar = states('sensor.power_flow_gauge_max_solar')|float(0) %}
          {% set mean_solar = states('sensor.power_flow_gauge_mean_solar')|float(0) %}
          {% set to_house = states('sensor.power_flow_gauge_solar_to_house')|float(0) %}
          {% set to_battery = states('sensor.power_flow_gauge_solar_to_battery')|float(0) %}
          {% set to_grid = states('sensor.power_flow_gauge_solar_to_grid')|float(0) %}
          {% set used_now = to_house + to_battery + to_grid %}
          {% set baseline = [mean_solar, used_now] | max %}
          {{ max_solar - baseline }}
          {% else %}
            {{ none }}
          {% endif %}

################################################
# Sensors to calculate statistics.
################################################
sensor:
  - platform: statistics
    name: Power Flow Gauge - Max Consumption
    unique_id: power_flow_gauge_max_consumption
    entity_id: sensor.power_flow_gauge_total_consumption
    state_characteristic: value_max
    max_age:
      hours: 24

  - platform: statistics
    name: Power Flow Gauge - Mean Consumption
    unique_id: power_flow_gauge_mean_consumption
    entity_id: sensor.power_flow_gauge_total_consumption
    state_characteristic: mean
    max_age:
      hours: 24

  - platform: statistics
    name: Power Flow Gauge - Max Solar
    unique_id: power_flow_gauge_max_solar
    entity_id: sensor.power_flow_gauge_total_solar
    state_characteristic: value_max
    max_age:
      hours: 24

  - platform: statistics
    name: Power Flow Gauge - Mean Solar
    unique_id: power_flow_gauge_mean_solar
    entity_id: sensor.power_flow_gauge_total_solar
    state_characteristic: mean
    max_age:
      hours: 24

  - platform: statistics
    name: Power Flow Gauge - Max Grid Import
    unique_id: power_flow_gauge_max_grid_import
    entity_id: sensor.power_flow_gauge_total_grid_import
    state_characteristic: value_max
    max_age:
      hours: 24

  - platform: statistics
    name: Power Flow Gauge - Mean Grid Import
    unique_id: power_flow_gauge_mean_grid_import
    entity_id: sensor.power_flow_gauge_total_grid_import
    state_characteristic: mean
    max_age:
      hours: 24

  - platform: statistics
    name: Power Flow Gauge - Max Grid Export
    unique_id: power_flow_gauge_max_grid_export
    entity_id: sensor.power_flow_gauge_total_grid_export
    state_characteristic: value_max
    max_age:
      hours: 24

  - platform: statistics
    name: Power Flow Gauge - Mean Grid Export
    unique_id: power_flow_gauge_mean_grid_export
    entity_id: sensor.power_flow_gauge_total_grid_export
    state_characteristic: mean
    max_age:
      hours: 24

  - platform: statistics
    name: Power Flow Gauge - Max Battery Discharging
    unique_id: power_flow_gauge_max_battery_discharging
    entity_id: sensor.power_flow_gauge_total_battery_discharging
    state_characteristic: value_max
    max_age:
      hours: 24

  - platform: statistics
    name: Power Flow Gauge - Mean Battery Discharging
    unique_id: power_flow_gauge_mean_battery_discharging
    entity_id: sensor.power_flow_gauge_total_battery_discharging
    state_characteristic: mean
    max_age:
      hours: 24

  - platform: statistics
    name: Power Flow Gauge - Max Battery Charging
    unique_id: power_flow_gauge_max_battery_charging
    entity_id: sensor.power_flow_gauge_total_battery_charging
    state_characteristic: value_max
    max_age:
      hours: 24

  - platform: statistics
    name: Power Flow Gauge - Mean Battery Charging
    unique_id: power_flow_gauge_mean_battery_charging
    entity_id: sensor.power_flow_gauge_total_battery_charging
    state_characteristic: mean
    max_age:
      hours: 24
